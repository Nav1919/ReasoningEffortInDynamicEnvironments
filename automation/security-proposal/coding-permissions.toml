# INACTIVE proposal: apply only after explicit operator approval.
# Select research-git instead of :workspace in the dedicated worker only.
# All worktrees share this isolated clone's Git metadata. This does not enforce
# branch protection inside the clone; host publishing rejects main and bad authors.
[permissions.research-git]
extends = ":workspace"

[permissions.research-git.filesystem]
"/workspace/repo/.git" = "write"

[permissions.research-git.network]
enabled = false

# Proposed callback approvals, to be merged into the native managed section:
[mcp_servers.hermes-tools.tools.kanban_heartbeat]
approval_mode = "approve"
[mcp_servers.hermes-tools.tools.kanban_comment]
approval_mode = "approve"
[mcp_servers.hermes-tools.tools.kanban_request_review]
approval_mode = "approve"
[mcp_servers.hermes-tools.tools.kanban_block]
approval_mode = "approve"
