# Docker Desktop exposes Windows bind mounts as root-owned. Keep private homes,
# the shared board, and Git ownership on Linux volumes instead. Host seeds remain
# backups; no original state is deleted. Runtime policies are unchanged.
services:
  controller:
    volumes: !override
      - research-controller-home:/opt/data
      - research-board:/board
  worker:
    volumes: !override
      - research-worker-home:/opt/data
      - research-board:/board
      - research-code:/workspace
volumes:
  research-controller-home:
    name: research-controller-home
    external: true
  research-worker-home:
    name: research-worker-home
    external: true
  research-board:
    name: research-board
    external: true
  research-code:
    name: research-code
    external: true
