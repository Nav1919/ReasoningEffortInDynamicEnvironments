name: Offline tests

on:
  push:
    branches: [main, freeway-replay, fair-model-comparisons, saved-comparison-runs, gptoss-pilot-results]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
          cache: pip
          cache-dependency-path: |
            requirements-freeway.txt
            requirements-lock.txt
      - run: python -m pip install -r requirements-freeway.txt
      - run: python -m pip check
      - run: python -m unittest discover -v
      - run: git diff --exit-code
