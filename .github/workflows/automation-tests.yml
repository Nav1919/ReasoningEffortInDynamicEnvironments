name: Automation tests
on:
  pull_request:
  push:
    branches: ['agent/**']
permissions:
  contents: read
jobs:
  automation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: docker compose -f automation/compose.yaml config --quiet
